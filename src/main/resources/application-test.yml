spring:
  datasource:
    # 테스트마다 메모리에서 새로 만드는 H2 DB를 PostgreSQL 문법 호환 모드로 실행.
    url: jdbc:h2:mem:naverworks;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # H2는 PostgreSQL의 pg_trgm 확장을 지원하지 않아 공통 마이그레이션만 검증.
    locations: classpath:db/migration

app:
  storage:
    # 테스트에서 올린 파일은 빌드 폴더에 저장(지워져도 무방).
    root: target/test-uploads
  attachment:
    # 테스트 컴퓨터의 남은 디스크 공간과 상관없이 업로드 테스트가 돌도록 남은 공간 검사는 끔(검사 자체는 따로 테스트).
    min-free-bytes: 0
    # 사진을 여러 장 올리는 테스트가 막히지 않도록 크게(제한 자체는 ChatAttachmentTests에서 따로 검증).
    uploads-per-minute: 1000
  board:
    # 매일 인사 글 예약 작업은 테스트 중 끼어들지 않게 끔(올리는 동작 자체는 BoardDailyGreetingTests에서 직접 호출).
    daily-greeting:
      enabled: false
  market:
    # 테스트에서는 실제 시세 API를 부르지 않음(분석 규칙은 가짜 응답으로 BoardMarketReportTests에서 검증)
    enabled: false
  cors:
    allowed-origin: http://localhost:3000
  auth:
    # 테스트 전용 키이므로 운영 키와 분리. 실제 운영 시크릿은 절대 여기에 넣지 않음.
    issuer: naverworks-clone-api-test
    jwt-secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-expiration: PT3H
    refresh-token-expiration: P7D
    refresh-cookie-secure: false
