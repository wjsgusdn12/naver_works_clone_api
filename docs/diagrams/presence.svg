 stroke="#fcd34d" stroke-width="1.2"/><text x="178.672" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">자리 비움</text><rect x="221.8816" y="294" width="43.4624" height="24" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/><text x="243.6128" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">퇴근</text><rect x="273.344" y="294" width="43.4624" height="24" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/><text x="295.0752" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">부재</text><rect x="324.8064" y="294" width="43.4624" height="24" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/><text x="346.5376" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">휴가</text><rect x="376.2688" y="294" width="43.4624" height="24" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/><text x="398" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">출장</text><rect x="427.7312" y="294" width="43.4624" height="24" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/><text x="449.4624" y="310.32" font-size="12" font-weight="600" fill="#78350f" text-anchor="middle">병가</text><text x="92" y="340" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">고를 때 자동 해제 시각(최대 90일 뒤)을 함께 정할 수 있음</text>
